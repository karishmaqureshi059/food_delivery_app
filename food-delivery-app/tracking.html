<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Order - FoodExpress</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-container">
      <a href="index.html" class="navbar-brand">
        <span>🍔</span> FoodExpress
      </a>
      <div class="navbar-actions">
        <a href="orders.html" class="navbar-link">Back to Orders</a>
      </div>
    </div>
  </nav>

  <div class="tracking-container">
    <h1 style="margin-bottom: 24px;">Track Your Order</h1>

    <div id="tracking-content">
      <!-- Tracking content loaded via JS -->
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script>
    // Require authentication
    Auth.requireAuth();

    function loadTracking() {
      const orderId = Utils.getQueryParam('orderId');
      if (!orderId) {
        window.location.href = 'orders.html';
        return;
      }

      const order = DB.findById('orders', orderId);
      if (!order) {
        window.location.href = 'orders.html';
        return;
      }

      const restaurant = DB.findById('restaurants', order.restaurantId);
      const deliveryPartner = order.deliveryPartnerId ? DB.findById('deliveryPartners', order.deliveryPartnerId) : null;

      const steps = [
        { key: 'pending', label: 'Order Placed', icon: '📋', time: order.createdAt },
        { key: 'confirmed', label: 'Restaurant Accepted', icon: '✅', time: null },
        { key: 'preparing', label: 'Food Preparing', icon: '👨‍🍳', time: null },
        { key: 'ready', label: 'Ready for Pickup', icon: '📦', time: null },
        { key: 'out_for_delivery', label: 'Out for Delivery', icon: '🚗', time: null },
        { key: 'delivered', label: 'Delivered', icon: '🎉', time: order.deliveredAt }
      ];

      const currentStepIndex = steps.findIndex(s => s.key === order.status);

      document.getElementById('tracking-content').innerHTML = `
        <div class="card" style="padding: 24px; margin-bottom: 24px;">
          <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
            <div>
              <h2 style="font-size: 24px; font-weight: 800;">Order #${order.id.slice(-6).toUpperCase()}</h2>
              <p style="color: var(--gray); margin-top: 4px;">${restaurant ? restaurant.name : 'Restaurant'}</p>
            </div>
            <div style="text-align: right;">
              <p style="color: var(--gray); font-size: 14px;">Estimated Delivery</p>
              <p style="font-size: 20px; font-weight: 700; color: var(--primary);">${restaurant ? restaurant.deliveryTime : '30-45 min'}</p>
            </div>
          </div>
        </div>

        <div class="card" style="padding: 30px;">
          <div class="tracking-timeline">
            ${steps.map((step, index) => {
              const isCompleted = index < currentStepIndex || order.status === 'delivered';
              const isCurrent = index === currentStepIndex && order.status !== 'delivered';
              return `
                <div class="tracking-step ${isCompleted ? 'completed' : ''} ${isCurrent ? 'current' : ''}">
                  <div style="display: flex; align-items: center; gap: 12px;">
                    <span style="font-size: 24px;">${step.icon}</span>
                    <div>
                      <div class="tracking-step-title">${step.label}</div>
                      ${step.time ? `<div class="tracking-step-time">${Utils.formatDateTime(step.time)}</div>` : ''}
                      ${isCurrent ? '<div class="tracking-step-time" style="color: var(--primary); font-weight: 600;">In Progress...</div>' : ''}
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        ${deliveryPartner ? `
          <div class="card" style="padding: 24px; margin-top: 24px;">
            <h3 style="margin-bottom: 16px;">Delivery Partner</h3>
            <div style="display: flex; align-items: center; gap: 16px;">
              <img src="${deliveryPartner.avatar}" alt="${deliveryPartner.name}" style="width: 60px; height: 60px; border-radius: 50%; object-fit: cover;">
              <div>
                <p style="font-weight: 700;">${deliveryPartner.name}</p>
                <p style="color: var(--gray); font-size: 14px;">${deliveryPartner.phone}</p>
                <p style="color: var(--success); font-size: 13px;">★ ${deliveryPartner.rating} rating</p>
              </div>
            </div>
          </div>
        ` : ''}

        <div class="card" style="padding: 24px; margin-top: 24px;">
          <h3 style="margin-bottom: 16px;">Order Items</h3>
          ${order.items.map(item => `
            <div class="order-item">
              <span>${item.quantity}x ${item.name}</span>
              <span>$${(item.price * item.quantity).toFixed(2)}</span>
            </div>
          `).join('')}
          <div style="border-top: 2px solid var(--border); margin-top: 12px; padding-top: 12px; display: flex; justify-content: space-between; font-weight: 700;">
            <span>Total</span>
            <span style="color: var(--primary);">$${order.total.toFixed(2)}</span>
          </div>
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', loadTracking);
  </script>
</body>
</html>
