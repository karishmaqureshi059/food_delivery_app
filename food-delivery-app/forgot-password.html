<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - FoodExpress</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff6b35 0%, #e55a2b 100%);
      padding: 20px;
    }
    .auth-card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 450px;
      padding: 40px;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .auth-logo {
      font-size: 48px;
      margin-bottom: 10px;
    }
    .auth-title {
      font-size: 28px;
      font-weight: 800;
      color: var(--dark);
    }
    .auth-subtitle {
      color: var(--gray);
      margin-top: 8px;
    }
    .step-content {
      display: none;
    }
    .step-content.active {
      display: block;
    }
    .otp-inputs {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin: 20px 0;
    }
    .otp-input {
      width: 50px;
      height: 50px;
      border: 2px solid var(--border);
      border-radius: 8px;
      text-align: center;
      font-size: 24px;
      font-weight: 700;
    }
    .otp-input:focus {
      border-color: var(--primary);
      outline: none;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">🍔</div>
        <h1 class="auth-title">Forgot Password</h1>
        <p class="auth-subtitle">Enter your email to receive a reset code</p>
      </div>

      <!-- Step 1: Enter Email -->
      <div class="step-content active" id="step-1">
        <form onsubmit="sendResetCode(event)">
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-input" id="reset-email" placeholder="Enter your email" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg">Send Reset Code</button>
        </form>
      </div>

      <!-- Step 2: Enter OTP -->
      <div class="step-content" id="step-2">
        <div style="text-align: center; margin-bottom: 20px;">
          <div style="font-size: 48px; margin-bottom: 16px;">📧</div>
          <h3>Check Your Email</h3>
          <p style="color: var(--gray); margin-top: 8px;">We've sent a 6-digit code to <span id="reset-email-display"></span></p>
        </div>
        <div class="otp-inputs">
          <input type="text" class="otp-input" maxlength="1" onkeyup="moveToNext(this, 1)">
          <input type="text" class="otp-input" maxlength="1" onkeyup="moveToNext(this, 2)">
          <input type="text" class="otp-input" maxlength="1" onkeyup="moveToNext(this, 3)">
          <input type="text" class="otp-input" maxlength="1" onkeyup="moveToNext(this, 4)">
          <input type="text" class="otp-input" maxlength="1" onkeyup="moveToNext(this, 5)">
          <input type="text" class="otp-input" maxlength="1" onkeyup="moveToNext(this, 6)">
        </div>
        <button class="btn btn-primary btn-block btn-lg" onclick="verifyResetCode()">Verify Code</button>
        <p style="text-align: center; margin-top: 16px; color: var(--gray); font-size: 14px;">
          Didn't receive code? <a href="#" onclick="resendCode()" style="color: var(--primary); font-weight: 600;">Resend</a>
        </p>
      </div>

      <!-- Step 3: New Password -->
      <div class="step-content" id="step-3">
        <form onsubmit="resetPassword(event)">
          <div class="form-group">
            <label class="form-label">New Password</label>
            <input type="password" class="form-input" id="new-password" placeholder="Enter new password" required minlength="6">
          </div>
          <div class="form-group">
            <label class="form-label">Confirm Password</label>
            <input type="password" class="form-input" id="confirm-password" placeholder="Confirm new password" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg">Reset Password</button>
        </form>
      </div>

      <!-- Step 4: Success -->
      <div class="step-content" id="step-4">
        <div style="text-align: center; padding: 20px 0;">
          <div style="font-size: 64px; margin-bottom: 16px;">✅</div>
          <h3>Password Reset!</h3>
          <p style="color: var(--gray); margin-top: 8px;">Your password has been successfully reset.</p>
          <a href="login.html" class="btn btn-primary btn-lg mt-3">Back to Login</a>
        </div>
      </div>

      <div style="text-align: center; margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border);">
        <p style="color: var(--gray);">Remember your password? <a href="login.html" style="color: var(--primary); font-weight: 700;">Sign In</a></p>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script>
    let resetEmail = '';
    let resetOTP = '';

    function showStep(step) {
      document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
      document.getElementById('step-' + step).classList.add('active');
    }

    function sendResetCode(e) {
      e.preventDefault();
      resetEmail = document.getElementById('reset-email').value;
      const user = DB.findByField('users', 'email', resetEmail);
      if (!user) {
        Utils.toast('Email not found', 'error');
        return;
      }
      resetOTP = Math.floor(100000 + Math.random() * 900000).toString();
      console.log('Reset OTP:', resetOTP);
      document.getElementById('reset-email-display').textContent = resetEmail;
      Utils.toast('Reset code sent to your email!');
      showStep(2);
    }

    function moveToNext(input, nextIndex) {
      if (input.value.length === 1) {
        const inputs = document.querySelectorAll('.otp-input');
        if (nextIndex < inputs.length) {
          inputs[nextIndex].focus();
        }
      }
    }

    function verifyResetCode() {
      const inputs = document.querySelectorAll('.otp-input');
      let enteredOTP = '';
      inputs.forEach(input => enteredOTP += input.value);

      if (enteredOTP === resetOTP) {
        Utils.toast('Code verified!');
        showStep(3);
      } else {
        Utils.toast('Invalid code. Please try again.', 'error');
      }
    }

    function resendCode() {
      resetOTP = Math.floor(100000 + Math.random() * 900000).toString();
      console.log('New Reset OTP:', resetOTP);
      Utils.toast('New code sent!');
    }

    function resetPassword(e) {
      e.preventDefault();
      const newPass = document.getElementById('new-password').value;
      const confirmPass = document.getElementById('confirm-password').value;

      if (newPass !== confirmPass) {
        Utils.toast('Passwords do not match', 'error');
        return;
      }

      const user = DB.findByField('users', 'email', resetEmail);
      if (user) {
        DB.update('users', user.id, { password: newPass });
        Utils.toast('Password reset successful!');
        showStep(4);
      }
    }
  </script>
</body>
</html>
